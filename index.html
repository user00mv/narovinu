<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>NA ROVINU</title>
<meta name="description" content="Jeden partner pro celý dům. Okna, stavby, teplo, energie a elektro pod jednou značkou.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-8 -22 150 150'%3E%3Cpath d='M0 7.5L40 60.7L40 105L0 105Z' fill='%23161616'/%3E%3Cpath d='M92 0L134 0L134 104.5L92 48.6Z' fill='%23161616'/%3E%3Cpath d='M2 0L14.5 0L93.5 105L81 105Z' fill='%23EF3E42'/%3E%3Cpath d='M19 0L31.5 0L110.5 105L98 105Z' fill='%23EF3E42'/%3E%3Cpath d='M36 0L48.5 0L127.5 105L115 105Z' fill='%23EF3E42'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400..700&family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap">
<style>
/* Layout: světlý web po vzoru cisteni-malovani.cz. Bílé plochy, jemný rastr v hero, karty 14 px, pilulková tlačítka, tmavý pruh čísel, červený CTA pás, tmavá patička. Jeden vizuál, světlý. */
:root{
  color-scheme:light;
  --red:#EF3E42; --red-dark:#C8262B; --red-50:#FEF1F1; --red-100:#FCDCDD;
  --ink:#1A1A1A; --graphite:#6B6B6B; --silver:#E5E5E5;
  --bg:#FFFFFF; --fog:#F7F6F4; --card:#FFFFFF;
  --line:rgba(26,26,26,.08); --line-strong:rgba(26,26,26,.14);
  --green:#0E8F5B; --green-50:#ECF8F2; --green-100:#CDEEDD;
  --warn:#8F5300; --warn-bg:#FFF4E0;
  --f-display:"Unbounded","Helvetica Neue",Arial,sans-serif;
  --f-body:"Host Grotesk","Helvetica Neue",Arial,sans-serif;
  --maxw:1200px; --pad:clamp(16px,4vw,48px); --radius:14px;
  --hdr:76px;
  --ill-bg:#F3F2EF;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{max-width:100%}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:6px}
::selection{background:var(--red);color:#fff}

.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad)}
.muted{color:var(--graphite)}
.mono{font-family:var(--f-body);font-size:13px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.surface{background:var(--fog)}
.band{background:var(--ink);color:#fff}
.band .muted{color:rgba(255,255,255,.62)}

/* typography */
.display{font-family:var(--f-display);font-weight:600;font-size:clamp(38px,5.6vw,76px);line-height:1.02;letter-spacing:-.04em;margin:0;text-wrap:balance}
.h1{font-family:var(--f-display);font-weight:600;font-size:clamp(34px,4.8vw,60px);line-height:1.04;letter-spacing:-.04em;margin:0;text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,4vw,52px);line-height:1.04;letter-spacing:-.04em;margin:0;text-wrap:balance}
.h3{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,2vw,24px);line-height:1.2;letter-spacing:-.025em;margin:0;text-wrap:balance}
.h4{font-family:var(--f-display);font-weight:500;font-size:18px;line-height:1.3;letter-spacing:-.02em;margin:0}
.display,.h1,.h2,.h3{overflow-wrap:break-word}
.ac{color:var(--red)}
.lead{font-size:clamp(17px,1.6vw,20px);line-height:1.55;max-width:46ch;margin:0;color:var(--graphite)}
.band .lead{color:rgba(255,255,255,.7)}
.prose{max-width:64ch}
.prose p{margin:0 0 1em}
.eyebrow{font-family:var(--f-body);font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--red);text-transform:uppercase;margin:0}
.eyebrow.nzu{color:var(--green)}
.band .eyebrow{color:#FF8A8D}

/* buttons */
.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 26px;border-radius:999px;font-size:15px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:transform .2s,background .2s,border-color .2s,color .2s,box-shadow .2s;white-space:nowrap;line-height:1.2}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 8px 24px -8px rgba(239,62,66,.6)}
.btn-primary:hover{background:var(--red-dark)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#000}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn-ghost:hover{border-color:var(--ink)}
.band .btn-ghost,.cta .btn-ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.band .btn-ghost:hover,.cta .btn-ghost:hover{border-color:#fff}
.btn-white{background:#fff;color:var(--ink)}
.btn-nzu{background:var(--green);color:#fff;box-shadow:0 8px 24px -8px rgba(14,143,91,.55)}
.btn-nzu:hover{background:#0A7A4D}
.btn-sm{padding:11px 18px;font-size:14px}
.btn .arr{display:inline-block;transition:transform .2s}
.btn:hover .arr{transform:translateX(3px)}
.link{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px;color:var(--red);cursor:pointer;background:none;border:0;padding:0;transition:gap .2s}
.link:hover{gap:10px}

/* prototype strip */
.proto{background:var(--ink);color:rgba(255,255,255,.8);font-size:12.5px;font-weight:500}
.proto .wrap{display:flex;justify-content:space-between;gap:12px;padding-block:8px;flex-wrap:wrap}
.proto button{background:none;border:0;color:#fff;cursor:pointer;font-size:inherit;text-decoration:underline;padding:0}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:24px;height:var(--hdr)}
.logo{--lh:34px;display:flex;align-items:center;gap:calc(var(--lh) * .3);color:var(--ink);flex-shrink:0}
.logo svg{height:var(--lh);width:auto;flex-shrink:0;display:block}
.logo b{font-family:var(--f-display);font-weight:800;font-size:calc(var(--lh) * .68);letter-spacing:-.05em;line-height:1;position:relative;top:.1em;white-space:nowrap}
.nav{display:flex;gap:4px;margin-inline:auto;align-items:center}
.nav a{font-size:14.5px;font-weight:500;padding:8px 12px;color:var(--ink);position:relative}
.nav a::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav a:hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1)}
.hdr .btn{padding:12px 20px;font-size:14px}
.burger{display:none;margin-left:auto;width:46px;height:46px;border:1px solid var(--line-strong);border-radius:999px;background:#fff;cursor:pointer;align-items:center;justify-content:center}
.burger span{display:block;width:18px;height:2px;background:var(--ink);box-shadow:0 6px 0 var(--ink),0 -6px 0 var(--ink);border-radius:2px}
@media (max-width:1100px){.nav,.hdr .btn{display:none}.burger{display:inline-flex}}

.mmenu{position:fixed;inset:0;z-index:60;background:#fff;color:var(--ink);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) var(--pad) calc(env(safe-area-inset-bottom,0px) + 24px)}
.mmenu-top{display:flex;justify-content:space-between;align-items:center;height:52px}
.mmenu .close{width:46px;height:46px;border:1px solid var(--line-strong);border-radius:999px;background:#fff;font-size:24px;cursor:pointer;line-height:1}
.mmenu nav{display:flex;flex-direction:column;margin-top:28px;border-top:1px solid var(--line)}
.mmenu nav a{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.03em;padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.mmenu nav a span{color:var(--red);font-weight:400}
.mmenu .btn{margin-top:auto;width:100%}

.mcta{display:none;position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px var(--pad) calc(env(safe-area-inset-bottom,0px) + 10px)}
.mcta .btn{width:100%}
@media (max-width:760px){.mcta{display:block} body.has-mcta{padding-bottom:78px} body.no-mcta .mcta{display:none}}

/* motif */
.stripes path{fill:var(--red)}

/* sections */
section{position:relative}
.sec{padding-block:clamp(72px,9vw,120px)}
.sec-sm{padding-block:clamp(48px,6vw,80px)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-bottom:clamp(36px,5vw,64px);align-items:end}
.sec-head .t{display:grid;gap:14px}
.sec-head .right{font-size:16px;color:var(--graphite);max-width:44ch;margin:0;padding-bottom:6px}
@media (min-width:900px){.sec-head.split{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:48px}}
.rule{border:0;border-top:1px solid var(--line);margin:0}
.gridbg{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.gridbg::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at top,#000 30%,transparent 70%);mask-image:radial-gradient(ellipse at top,#000 30%,transparent 70%)}
.gridbg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.28}
.gridbg .b1{width:420px;height:420px;background:var(--red-100);right:-80px;top:-120px}
.gridbg .b2{width:360px;height:360px;background:#E9E6E0;left:-120px;top:240px}

/* hero */
.hero{overflow:hidden}
.hero-in{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(36px,5vw,56px);padding-block:clamp(48px,7vw,96px) clamp(48px,6vw,80px);align-items:center}
@media (min-width:980px){.hero-in{grid-template-columns:minmax(0,6fr) minmax(0,6fr)}}
.hero-copy{display:grid;gap:26px;align-content:start}
.hero-badge{display:inline-flex;align-items:center;gap:10px;justify-self:start;padding:8px 16px;border:1px solid var(--line-strong);border-radius:999px;font-size:13px;font-weight:500;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);flex-wrap:wrap}
.hero-badge .dot{width:3px;height:3px;border-radius:50%;background:var(--graphite)}
.hero-badge .st{color:var(--red)}
.hero-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 28px;max-width:720px;margin-top:18px}
@media (min-width:640px){.hero-meta{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hero-meta .m{font-size:13px;color:var(--graphite);line-height:1.4}
.hero-meta .m b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--ink);letter-spacing:-.02em;margin-bottom:4px}
.ba{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center;width:100%}
.ba-card{position:relative;margin:0;border-radius:16px;overflow:hidden;background:var(--ill-bg);border:5px solid #fff;box-shadow:0 24px 48px -24px rgba(26,26,26,.35),0 8px 16px -10px rgba(26,26,26,.15);aspect-ratio:580/380;min-width:0}
.ba-card svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ba-card.old svg{filter:saturate(.75)}
.ba-card{aspect-ratio:3/2}
.ba-arrow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(239,62,66,.6)}
.ba-arrow b{font-size:18px;line-height:1;font-weight:600}
.ba-arrow .v{display:none}
@media (min-width:980px){.ba{grid-template-columns:minmax(0,1fr);gap:18px}.ba-card.old{width:84%;justify-self:start}.ba-card:not(.old){width:84%;justify-self:end}.ba-arrow{left:50%;top:50%}.ba-arrow .h{display:none}.ba-arrow .v{display:block}}
.cap{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:8px;z-index:2}
.cap::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
.cap.old::before{background:var(--graphite)}

/* stats bar */
.stats{background:var(--ink);color:#fff;padding-block:clamp(44px,5vw,64px)}
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 16px}
@media (min-width:860px){.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}}
.stat{display:flex;flex-direction:column;gap:8px;min-width:0}
.stat .n{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,2.6vw,38px);line-height:1;letter-spacing:-.045em;white-space:nowrap}
.stat .n .u{color:var(--red);font-size:.55em;letter-spacing:-.02em;margin-left:4px}
.stat span{color:rgba(255,255,255,.65);font-size:14px;max-width:24ch}

/* why cards */
.why{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:860px){.why{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:32px;display:flex;flex-direction:column;gap:14px;position:relative;min-height:220px;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s,border-color .3s}
.wcard:hover{transform:translateY(-3px);box-shadow:0 24px 48px -24px rgba(26,26,26,.2)}
.wcard .no{font-family:var(--f-display);font-weight:500;font-size:12px;color:var(--graphite);letter-spacing:.06em;position:absolute;right:28px;top:30px}
.wcard p{margin:0;color:var(--graphite);font-size:15.5px}
.ic{width:48px;height:48px;border-radius:12px;background:var(--red-50);display:flex;align-items:center;justify-content:center;color:var(--red);flex-shrink:0}
.ic svg{width:24px;height:24px}

/* merge diagram */
.merge{width:100%;height:auto;display:block}
.merge text{font-family:var(--f-body);font-size:15px;font-weight:500;fill:var(--graphite)}
.merge .end{font-family:var(--f-display);font-size:16px;font-weight:600;fill:var(--ink)}
.merge .ln{stroke:var(--line-strong);stroke-width:1.5;fill:none}
.merge .ln-r{stroke:var(--red);stroke-width:4;fill:none}
.merge .dot{fill:#C9C6C0}
.merge .hub{fill:var(--red)}

/* divisions */
.divs{display:grid;gap:16px}
.div-block{display:grid;grid-template-columns:minmax(0,1fr);background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative;color:var(--ink);transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.div-block:hover{transform:translateY(-3px);box-shadow:0 30px 60px -30px rgba(26,26,26,.28)}
.div-ill{position:relative;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--ill-bg);margin:10px;border-radius:10px}
.div-ill svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.div-block:hover .div-ill svg{transform:scale(1.03)}
.div-body{display:grid;gap:18px;align-content:center;padding:clamp(22px,3vw,44px)}
.div-body p{margin:0;color:var(--graphite);max-width:46ch}
.div-areas{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 0;padding:0;list-style:none}
.div-areas li{font-size:13px;font-weight:500;padding:6px 12px;border:1px solid var(--line-strong);border-radius:999px;color:var(--ink)}
.div-body .more{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--red);transition:gap .2s}
.div-block:hover .more{gap:10px}
@media (min-width:900px){
  .div-block{grid-template-columns:minmax(0,6fr) minmax(0,5fr)}
  .div-block:nth-child(even){grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
  .div-block:nth-child(even) .div-ill{order:2}
  .div-ill{aspect-ratio:auto;min-height:400px}
}
.lockup{display:flex;align-items:center;gap:12px;color:var(--ink)}
.lockup svg{height:34px;width:auto;flex-shrink:0}
.lockup .t{display:grid;line-height:1}
.lockup .t b{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.05em}
.lockup .t span{font-weight:600;font-size:11.5px;letter-spacing:.12em;margin-top:5px;color:var(--graphite);display:flex;align-items:center}
.lockup.lg svg{height:46px;width:auto}
.lockup.lg .t b{font-size:24px}
.lockup .acc{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%}

/* nzu */
.nzu-grid{display:grid;gap:clamp(36px,5vw,64px)}
@media (min-width:980px){.nzu-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}}
.nzu-fact{display:flex;gap:18px;align-items:center;padding:20px 22px;background:#fff;border:1px solid var(--green-100);border-radius:var(--radius);max-width:54ch}
.nzu-fact b{font-family:var(--f-display);font-size:clamp(24px,2.6vw,34px);font-weight:600;letter-spacing:-.04em;color:var(--green);white-space:nowrap}
.nzu-fact span{font-size:15px;color:var(--graphite)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--graphite);white-space:nowrap}
.tag.nzu{border-color:var(--green-100);color:var(--green);background:var(--green-50)}

/* dashboard */
.dash{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 30px 60px -36px rgba(26,26,26,.25)}
.dash-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dash-head b{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.02em}
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.dash-cell{padding:20px 24px;border-bottom:1px solid var(--line);display:grid;gap:6px;align-content:start;min-width:0}
.dash-cell:nth-child(odd){border-right:1px solid var(--line)}
.dash-cell .k{font-size:13.5px;color:var(--graphite);font-weight:500;line-height:1.3}
.dash-cell .v{font-family:var(--f-display);font-size:clamp(19px,2vw,26px);font-weight:600;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.dash-cell .v small{font-family:var(--f-body);font-size:.55em;font-weight:600;letter-spacing:0;white-space:nowrap}
.dash-cell .s{font-size:13px;color:var(--graphite)}
.dash-cell.g .v{color:var(--green)}
.dash-cell.total{background:var(--ink);color:#fff;border-color:var(--ink)}
.dash-cell.total .k,.dash-cell.total .s{color:rgba(255,255,255,.65)}
.dash-foot{padding:14px 24px;font-size:13px;color:var(--graphite);background:var(--fog)}
@media (min-width:720px){.dash-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.dash-grid.c3 .dash-cell{border-right:1px solid var(--line)}.dash-grid.c3 .dash-cell:nth-child(3n){border-right:0}}
.splitbar{display:flex;height:12px;width:100%;background:var(--silver);overflow:hidden;border-radius:999px}
.splitbar i{display:block;height:100%}
.splitbar .d{background:var(--green)}
.splitbar .u{background:#7CCBA6}
.splitbar .o{background:#CFCBC4}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--graphite)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;display:inline-block;border-radius:50%}

/* process */
.process{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin:0;padding:0;counter-reset:p;list-style:none}
@media (min-width:700px){.process{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.process{grid-template-columns:repeat(4,minmax(0,1fr))}}
.process li{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px;display:grid;gap:10px;align-content:start}
.process li::before{counter-increment:p;content:counter(p);font-family:var(--f-display);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--red-50);color:var(--red)}
.process b{display:block;font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px;line-height:1.25}
.process p{margin:0;color:var(--graphite);font-size:14.5px}

/* projects */
.projects{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){.projects{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1050px){.projects.p3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.proj{display:grid;color:inherit;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;min-width:0;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.proj:hover{transform:translateY(-3px);box-shadow:0 24px 48px -24px rgba(26,26,26,.25)}
.proj .ill{aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--ill-bg);position:relative;margin:8px 8px 0;border-radius:10px}
.proj .ill svg{width:100%;height:100%;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.proj:hover .ill svg{transform:scale(1.03)}
.proj .body{padding:18px 22px 22px;display:grid;gap:10px;align-content:start}
.proj .meta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px;color:var(--graphite);font-weight:500}
.proj .facts{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px;font-size:14px}
.proj .facts b{font-family:var(--f-display);font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ukazka{position:absolute;left:12px;top:12px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.95);color:var(--ink);padding:5px 10px;border-radius:999px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.chip{padding:10px 18px;border:1px solid var(--line-strong);border-radius:999px;background:#fff;font-weight:500;font-size:14.5px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip:hover{border-color:var(--ink)}

/* big CTA */
.cta{position:relative;background:var(--red);color:#fff;overflow:hidden}
.cta::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.18),transparent 40%),radial-gradient(circle at 85% 80%,rgba(0,0,0,.18),transparent 40%);pointer-events:none}
.cta::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 70%);mask-image:radial-gradient(ellipse at center,#000 20%,transparent 70%);pointer-events:none}
.cta-in{position:relative;z-index:2;display:grid;gap:32px;padding-block:clamp(72px,9vw,120px);align-items:end}
@media (min-width:900px){.cta-in{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:48px}}
.cta .h1{color:#fff}
.cta p{margin:0;color:rgba(255,255,255,.88);font-size:18px;max-width:40ch}
.cta .btn-white:hover{background:#FFF3F3}
.cta .stripes{position:absolute;right:-30px;bottom:-12px;width:min(34vw,360px);z-index:1;opacity:.16}
.cta .stripes path{fill:#fff}

/* footer */
.ftr{background:var(--ink);color:rgba(255,255,255,.7);padding-block:72px 32px}
.ftr-grid{display:grid;gap:36px;grid-template-columns:minmax(0,1fr);padding-bottom:48px;border-bottom:1px solid rgba(255,255,255,.1)}
@media (min-width:860px){.ftr-grid{grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(0,1fr));gap:48px}}
.ftr h4{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#fff;margin:0 0 16px}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ftr a{color:rgba(255,255,255,.7);font-size:15px;transition:color .2s}
.ftr a:hover{color:#fff}
.ftr .logo{color:#fff;--lh:38px}
.ftr-bottom{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;padding-top:24px;font-size:13px;color:rgba(255,255,255,.5)}
.ftr-bottom a{font-size:13px;color:rgba(255,255,255,.5)}

/* page header */
.phead{overflow:hidden;border-bottom:1px solid var(--line)}
.phead-in{position:relative;z-index:1;display:grid;gap:20px;padding-block:clamp(48px,7vw,96px) clamp(36px,5vw,64px)}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:500;color:var(--graphite)}
.crumbs a:hover{color:var(--red)}
.crumbs span{color:var(--line-strong)}

/* rows */
.rows{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:center;padding:22px 26px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);color:inherit;cursor:pointer;width:100%;text-align:left;transition:border-color .2s,box-shadow .2s,transform .2s}
.row:hover{border-color:var(--line-strong);box-shadow:0 18px 36px -24px rgba(26,26,26,.25);transform:translateY(-2px)}
.row p{margin:6px 0 0;color:var(--graphite);max-width:60ch;font-size:15px}
.row .go{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--red-50);color:var(--red);font-size:18px;transition:transform .2s}
.row:hover .go{transform:translateX(3px)}

.two{display:grid;gap:clamp(32px,5vw,64px)}
@media (min-width:980px){.two{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}.two.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.two.form{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}}

.xsell{display:grid;gap:10px}
.xsell a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;padding:20px 24px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);color:inherit;transition:border-color .2s,transform .2s}
.xsell a:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.xsell .who{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.02em}
.xsell .why{color:var(--graphite);grid-column:1/2;font-size:15px}
.xsell .go{grid-row:1/3;grid-column:2;align-self:center;color:var(--red);font-size:20px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:640px}
.tbl th,.tbl td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite);font-weight:600;background:var(--fog)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .sub{display:block;color:var(--graphite);font-size:13px;margin-top:2px}
.tbl tfoot td{font-weight:700;background:var(--fog)}
.tbl code{font-family:var(--f-body);font-weight:600;font-size:13px;background:var(--fog);padding:2px 6px;border-radius:6px}

/* calculator */
.calc{min-height:60vh;background:var(--fog)}
.calc-top{border-bottom:1px solid var(--line);background:#fff}
.calc-top .wrap{padding-block:16px;display:grid;gap:12px}
.prog-steps{display:flex;gap:6px 22px;flex-wrap:wrap;font-size:13px;font-weight:500;color:#A3A3A3}
.prog-steps .on{color:var(--ink);font-weight:600}
.prog-steps .done{color:var(--graphite)}
.prog{height:4px;background:var(--silver);position:relative;overflow:hidden;border-radius:999px}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:999px;transition:width .35s cubic-bezier(.2,.7,.2,1)}
.q{max-width:780px;padding-block:clamp(36px,6vw,72px);display:grid;gap:24px;animation:qin .35s cubic-bezier(.2,.7,.2,1)}
@keyframes qin{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.qn{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--red);text-transform:uppercase}
.q h2{font-family:var(--f-display);font-size:clamp(26px,3.6vw,42px);font-weight:600;letter-spacing:-.04em;line-height:1.08;margin:0;text-wrap:balance}
.q .help{color:var(--graphite);margin:0;max-width:60ch;font-size:16px}
.opts{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:560px){.opts.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.opts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.opt{display:flex;align-items:center;gap:14px;min-height:64px;padding:14px 18px;border:1.5px solid var(--line-strong);border-radius:12px;background:#fff;font-weight:600;font-size:16px;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s;line-height:1.3}
.opt:hover{border-color:var(--ink)}
.opt .box{width:22px;height:22px;border:1.5px solid var(--line-strong);border-radius:6px;flex-shrink:0;display:grid;place-items:center;transition:background .15s,border-color .15s}
.opt[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 3px var(--red-50)}
.opt[aria-pressed="true"] .box{background:var(--red);border-color:var(--red)}
.opt[aria-pressed="true"] .box::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.opt small{display:block;font-weight:400;color:var(--graphite);font-size:13.5px;margin-top:2px}
.opt .t{display:block;min-width:0}
.field{display:grid;gap:8px}
.field label,.field .lbl{font-weight:600;font-size:14.5px}
.inp{width:100%;min-height:60px;padding:0 18px;border:1.5px solid var(--line-strong);border-radius:12px;background:#fff;color:var(--ink);font-family:var(--f-display);font-size:20px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.inp:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(26,26,26,.06)}
.inp.sm{min-height:54px;font-family:var(--f-body);font-size:16px;font-weight:500;letter-spacing:0}
textarea.inp{min-height:120px;padding:14px 18px;font-family:var(--f-body);font-size:16px;font-weight:400;letter-spacing:0;line-height:1.5}
select.inp{font-family:var(--f-body);font-size:16px;letter-spacing:0}
.inp-unit{display:flex;align-items:stretch}
.inp-unit .inp{border-right:0;border-radius:12px 0 0 12px}
.inp-unit span{display:grid;place-items:center;padding:0 18px;border:1.5px solid var(--line-strong);border-left:0;border-radius:0 12px 12px 0;font-size:15px;font-weight:600;color:var(--graphite);background:var(--fog);min-width:64px}
.fields{display:grid;gap:16px}
@media (min-width:640px){.fields.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.fields.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.q-nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:6px}
.q-nav .back{background:none;border:0;cursor:pointer;font-weight:600;color:var(--graphite);padding:12px 6px}
.q-nav .back:hover{color:var(--ink)}
.helper{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:22px;display:grid;gap:16px}
.helper>b{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em}
.helper .res{font-weight:600;font-size:15px;color:var(--red)}
.err{color:var(--red-dark);font-weight:600;font-size:15px;margin:0}
.note{display:flex;gap:12px;padding:14px 18px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:14.5px;line-height:1.5}
.note::before{content:"";flex-shrink:0;width:8px;height:8px;border-radius:50%;background:var(--graphite);margin-top:7px}
.note.w{background:var(--warn-bg);border-color:transparent}
.note.w::before{background:#E39A2B}
.note.g{background:var(--green-50);border-color:transparent}
.note.g::before{background:var(--green)}
.note.r::before{background:var(--red)}
.notes{display:grid;gap:10px}

.result-head{position:relative;z-index:1;display:grid;gap:18px;padding-block:clamp(40px,6vw,72px) clamp(28px,4vw,40px)}
.res-grid{display:grid;gap:clamp(20px,3vw,32px)}
@media (min-width:1080px){.res-grid{grid-template-columns:minmax(0,8fr) minmax(0,4fr);align-items:start}}
.side{display:grid;gap:16px;align-content:start}
@media (min-width:1080px){.side{position:sticky;top:calc(var(--hdr) + 24px)}}
.month{display:grid;gap:10px}
.month .bar{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.month .bar i{display:block;height:10px;border-radius:999px}
.month .bar b{font-variant-numeric:tabular-nums}
.recs{margin:0;padding:0;list-style:none;counter-reset:r;display:grid;gap:0}
.recs li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:13px 0;border-top:1px solid var(--line)}
.recs li::before{counter-increment:r;content:counter(r);font-family:var(--f-display);font-weight:600;font-size:12px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--red-50);color:var(--red)}
.recs b{display:block;font-weight:600}
.recs span{color:var(--graphite);font-size:14.5px}

/* configurator */
.cfg{display:grid;gap:clamp(20px,3vw,32px)}
@media (min-width:1080px){.cfg{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start}}
.cfg-stage{background:var(--ill-bg);position:relative;overflow:hidden;border-radius:var(--radius);border:1px solid var(--line)}
.cfg-stage svg{display:block;width:100%;height:auto}
.cfg-panel{display:grid;gap:16px;align-content:start}
.toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.toggles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tgl{display:grid;gap:4px;align-content:start;min-height:84px;padding:14px 16px;border:1.5px solid var(--line-strong);border-radius:12px;background:#fff;text-align:left;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:-.02em;position:relative;transition:border-color .15s,box-shadow .15s}
.tgl small{font-family:var(--f-body);font-weight:500;color:var(--graphite);font-size:13px;letter-spacing:0}
.tgl::after{content:"";position:absolute;right:12px;top:14px;width:32px;height:18px;border-radius:9px;background:#D7D4CF;transition:background .15s}
.tgl::before{content:"";position:absolute;right:28px;top:16px;width:14px;height:14px;border-radius:50%;background:#fff;z-index:1;transition:right .15s}
.tgl[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 3px var(--red-50)}
.tgl[aria-pressed="true"]::after{background:var(--red)}
.tgl[aria-pressed="true"]::before{right:14px}
.range{width:100%;accent-color:var(--red)}

/* illustrations (light technical drawing) */
.ill text{font-family:var(--f-body);font-weight:500;fill:#4A4A4A}
.ill .lbl text{font-size:13px;font-weight:600;fill:var(--ink)}
.ill .lbl line{stroke:var(--red);stroke-width:1.2}
.ill .lbl circle{fill:var(--red)}
@media (max-width:620px){.ill .lbl{display:none}}
.ill .bg{fill:var(--ill-bg)}
.ill .rs{stroke:rgba(26,26,26,.06);stroke-width:1}
.ill .ln{stroke:var(--ink);fill:none;stroke-width:1.3}
.ill .ln2{stroke:var(--ink);fill:none;stroke-width:2}
.ill .dim{stroke:#A8A49D;fill:none;stroke-width:1.2}
.ill .dimf{fill:none;stroke:#9C8B76;stroke-width:1.2}
.ill .wall{fill:#D9D4CB;stroke:var(--ink);stroke-width:1.3}
.ill .wallnew{fill:#FFFFFF;stroke:var(--ink);stroke-width:1.3}
.ill .plinth{fill:#BDB6AB}
.ill .plinthnew{fill:#8F8C87}
.ill .seam{stroke:#E6E2DB;stroke-width:1}
.ill .roof{fill:#7C746B}
.ill .tile{stroke:#5F5850;stroke-width:1.2}
.ill .seamdark{stroke:#4A4C50;stroke-width:1.2}
.ill .glass{fill:#56616B}
.ill .glassnew{fill:#BFD6E6}
.ill .glint{stroke:#FFFFFF;stroke-width:1.6;opacity:.9}
.ill .frnew{fill:#FFFFFF;stroke:var(--ink);stroke-width:1.1}
.ill .frnew2{fill:#F6F6F4;stroke:#8A8A8A;stroke-width:1}
.ill .frold{fill:#8A735B}
.ill .mull{stroke:#8A735B;stroke-width:4}
.ill .izol{fill:url(#nr-izol)}
.ill .ground{fill:url(#nr-ground)}
.ill .lvl{fill:var(--ink)}
.ill .dark{fill:var(--ink)}
.ill .unit{fill:#FFFFFF;stroke:var(--ink);stroke-width:1.2}
.ill .fan{fill:#F1F0ED;stroke:#6B6B6B;stroke-width:1.6}
.ill .fanl{stroke:#6B6B6B;stroke-width:1.6;fill:none}
.ill .pv{fill:#22384E;stroke:#7D99B1;stroke-width:1}
.ill .pvl{stroke:#45607A;stroke-width:1}
.ill .red{fill:var(--red)}
.ill .sred{stroke:var(--red);stroke-width:2;fill:none}
.ill .redt{fill:var(--red)}
.ill .wtext{fill:#6B6B6B}
.ill .brace{stroke:var(--red);stroke-width:2.2}
.ill .smoke path{stroke-width:2}
.ill .detailbg{fill:#FFFFFF;stroke:rgba(26,26,26,.14);stroke-width:1}
.ill .chamber{fill:#FFFFFF;stroke:#8A8A8A;stroke-width:1}
.ill .glassedge{fill:#8DB2CC}
.ill .pipe-r{stroke:var(--red);stroke-width:3;fill:none}
.ill .loop{stroke:var(--ink);stroke-width:2.6;fill:none;stroke-linejoin:round}
.ill .baton{fill:#34B37B}
.ill .batoff{fill:#E1DED8}
.ill .rail{fill:#A3A09A}
.ill .mod{fill:#FFFFFF;stroke:#8A8A8A;stroke-width:1}
.ill .modred{fill:var(--red)}
.ill .tog{fill:var(--ink)}
.ill .boardbg{fill:#ECEAE6;stroke:rgba(26,26,26,.14);stroke-width:1}
.ill .pop{animation:pop .5s cubic-bezier(.2,.7,.2,1)}
@keyframes pop{from{opacity:.15}to{opacity:1}}

/* plan document */
.doc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);max-width:900px;margin-inline:auto;padding:clamp(24px,5vw,56px);display:grid;gap:30px;box-shadow:0 30px 60px -40px rgba(26,26,26,.3)}
.doc>*{min-width:0}
.doc-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:22px}
.doc h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--red);margin:0 0 12px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
@media (min-width:640px){.kv{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kv div{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);min-width:0}
.kv span{display:block;font-size:13px;color:var(--graphite)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* form */
.lead-form{display:grid;gap:24px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:clamp(22px,3.4vw,40px)}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--radius);background:var(--fog);padding:30px;display:grid;gap:8px;text-align:center;cursor:pointer;position:relative}
.drop:hover,.drop.over{border-color:var(--red);background:var(--red-50)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop b{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em}
.files{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.files li{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--fog);border-radius:10px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--red);flex-shrink:0;margin-top:2px}
.contact-box{display:grid;gap:0}
.contact-box div{display:grid;gap:4px;padding:16px 0;border-top:1px solid var(--line)}
.contact-box span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--graphite)}
.contact-box b{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.02em;user-select:all}
.contact-box button{justify-self:start;background:none;border:0;color:var(--red);font-size:13.5px;font-weight:600;cursor:pointer;padding:0}

.placeholder{border:1.5px dashed var(--line-strong);border-radius:var(--radius);padding:18px 20px;color:var(--graphite);font-size:15px}
.article{display:grid;gap:20px;max-width:700px}
.article p{margin:0}
.view{animation:vin .35s cubic-bezier(.2,.7,.2,1)}
@keyframes vin{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:none}}

.flow{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:f}
.flow li{display:grid;grid-template-columns:minmax(0,1fr);gap:8px 28px;padding:24px 26px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);align-items:center}
.flow li .st{font-family:var(--f-display);font-size:clamp(20px,2.2vw,26px);font-weight:600;letter-spacing:-.035em;line-height:1.1;display:flex;gap:14px;align-items:center}
.flow li .st::before{counter-increment:f;content:counter(f);font-size:13px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--red-50);color:var(--red);flex-shrink:0;letter-spacing:0}
.flow li p{margin:0;color:var(--graphite);max-width:52ch}
.flow li .out{font-size:13.5px;font-weight:600;color:var(--ink);background:var(--fog);border-radius:999px;padding:7px 14px;justify-self:start}
@media (min-width:900px){.flow li{grid-template-columns:minmax(0,4fr) minmax(0,5fr) minmax(0,3fr)}.flow li .out{justify-self:end}}

.split2{display:grid;gap:16px}
@media (min-width:860px){.split2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:clamp(22px,3vw,32px);display:grid;gap:14px;align-content:start}
.panel>b{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;font-size:17px}
.panel.nzu{border-color:var(--green-100);box-shadow:inset 0 4px 0 var(--green)}
.panel.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel.dark .muted{color:rgba(255,255,255,.65)}
.big{font-family:var(--f-display);font-size:clamp(30px,3.6vw,48px);font-weight:600;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.big.g{color:var(--green)}
.list{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.list li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:15.5px}
.list li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:8px}
.list.g li::before{background:var(--green)}
.empty{display:grid;gap:18px;justify-items:start;padding-block:clamp(48px,8vw,120px)}
.tbl.narrow{min-width:0}


/* fotografie */
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.div-block:hover .div-ill .ph,.proj:hover .ill .ph{transform:scale(1.03)}
.ilu{position:absolute;right:10px;top:10px;z-index:2;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:rgba(26,26,26,.55);backdrop-filter:blur(6px);padding:4px 8px;border-radius:999px}
.ba-card .ilu{display:none}
.ba-card.old .ph{filter:saturate(.8) contrast(.96)}
.proj-ba{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.proj-ba .ba-card{aspect-ratio:3/2}
@media (min-width:860px){.proj-ba{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}}

/* ---------- mobil ---------- */
@media (max-width:760px){
  :root{--hdr:64px}
  body{font-size:15.5px}
  .dsk{display:none}
  .proto .wrap{padding-block:6px}
  .sec{padding-block:56px}
  .sec-sm{padding-block:40px}
  .sec-head{margin-bottom:28px;gap:12px}
  .hero-in{padding-block:32px 40px;gap:28px}
  .hero-copy{gap:18px}
  .hero-badge{font-size:12px;padding:7px 12px;gap:7px}
  .hero .btns .btn,.phead .btns .btn{flex:1 1 auto}
  .hero-meta{gap:16px 18px;margin-top:6px}
  .hero-meta .m b{font-size:15px}
  .ba{gap:10px}
  .ba-card{border-width:3px;border-radius:12px}
  .ba-arrow{width:32px;height:32px}
  .ba-arrow b{font-size:15px}
  .cap{left:8px;bottom:8px;padding:4px 9px;font-size:11px;gap:6px}
  .phead-in{padding-block:32px 28px;gap:14px}
  .wcard{padding:24px;min-height:0}
  .wcard .no{top:24px;right:22px}
  .div-ill{margin:6px;border-radius:9px}
  .div-body{padding:20px 20px 24px;gap:14px}
  .div-areas li{font-size:12.5px;padding:5px 10px}
  .logo{--lh:28px}
  .lockup svg{height:30px;width:auto}
  .lockup.lg svg{height:38px;width:auto}
  .lockup.lg .t b{font-size:20px}
  .nzu-fact{flex-direction:column;align-items:flex-start;gap:6px;padding:18px}
  .process li{padding:20px;grid-template-columns:38px minmax(0,1fr);column-gap:14px;align-items:start}
  .process li::before{grid-row:1/3}
  .row{padding:18px;gap:4px 14px}
  .row .go{width:34px;height:34px;font-size:16px}
  .xsell a{padding:18px}
  .flow li{padding:18px}
  .panel{padding:20px}
  .cta-in{padding-block:56px;gap:22px}
  .cta .btns .btn{flex:1 1 auto}
  .cta .stripes{width:42vw}
  .ftr{padding-block:48px 28px}
  .ftr-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 20px;padding-bottom:32px}
  .ftr-grid>div:first-child{grid-column:1/-1}
  .filters{flex-wrap:nowrap;overflow-x:auto;margin-inline:calc(var(--pad) * -1);padding-inline:var(--pad);padding-bottom:4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;flex-shrink:0}
  /* kalkulačka */
  .calc-top .wrap{padding-block:12px;gap:10px}
  .prog-steps span:not(.on){display:none}
  .q{padding-block:28px 40px;gap:18px}
  .opt{min-height:56px;padding:12px 14px;font-size:15.5px}
  .opts.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts.c3 .opt{min-height:52px}
  .q-nav .btn{flex:1 1 auto}
  .inp{min-height:56px;font-size:19px}
  .inp-unit span{min-width:54px;padding:0 12px}
  .helper{padding:18px}
  .result-head{padding-block:28px 24px;gap:14px}
  .result-head .btns .btn{flex:1 1 auto}
  .month .bar{grid-template-columns:86px minmax(0,1fr) auto;font-size:13px;gap:8px}
  /* dashboard jako přehledný seznam */
  .dash-head{padding:14px 16px}
  .dash-grid,.dash-grid.c3{grid-template-columns:minmax(0,1fr)}
  .dash-cell,.dash-grid.c3 .dash-cell{border-right:0;padding:14px 16px;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-items:center}
  .dash-cell .k{grid-column:1}
  .dash-cell .s{grid-column:1;font-size:12.5px}
  .dash-cell .v{grid-column:2;grid-row:1/3;text-align:right;font-size:18px;white-space:nowrap}
  .dash-foot{padding:12px 16px;font-size:12.5px}
  /* rozpis opatření jako karty */
  .tbl-wrap:has(.rtbl),.tbl-wrap:has(.narrow){border:0;background:transparent;overflow:visible}
  .rtbl,.tbl.narrow{min-width:0;display:block}
  .rtbl thead,.tbl.narrow thead{display:none}
  .rtbl tbody,.rtbl tfoot,.tbl.narrow tbody{display:grid;gap:10px}
  .rtbl tfoot{margin-top:10px}
  .tbl.narrow tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .tbl.narrow td{display:block;padding:0;border:0;text-align:left!important;white-space:normal}
  .tbl.narrow td.nm{grid-column:1/-1;font-weight:600}
  .tbl.narrow td[data-label]::before{content:attr(data-label);display:block;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--graphite);margin-bottom:2px}
  .rtbl tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .rtbl tfoot tr{background:var(--ink);color:#fff;border-color:var(--ink)}
  .rtbl td{display:block;padding:0;border:0;text-align:left!important;white-space:normal}
  .rtbl td.nm,.rtbl td.rule{grid-column:1/-1}
  .rtbl td.hide-m{display:none}
  .rtbl td[data-label]::before{content:attr(data-label);display:block;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--graphite);margin-bottom:2px}
  .rtbl tfoot td[data-label]::before{color:rgba(255,255,255,.6)}
  .rtbl tfoot td{background:transparent}
  .rtbl td.rule{min-width:0!important}
  /* konfigurátor */
  .tgl{min-height:74px;padding:12px 14px;font-size:14px}
  .tgl::after{top:12px}
  .tgl::before{top:14px}
  /* dokument a formulář */
  .doc{padding:20px;gap:24px}
  .lead-form{padding:20px;gap:18px}
  .contact-box b{font-size:17px}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 90px)}
}
@media (max-width:559px){
  .ba{grid-template-columns:minmax(0,1fr);gap:12px}
  .ba-card.old{width:84%;justify-self:start}

  .ba-arrow{left:58%;top:47%}
  .ba-arrow .h{display:none}
  .ba-arrow .v{display:block}
}
@media (max-width:380px){
  .opts.c3{grid-template-columns:minmax(0,1fr)}

}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14.5px;z-index:80;max-width:calc(100% - 32px)}
</style>

rací. Místo toho si půjčí u zapojené banky nebo stavební spořitelny a Státní fond životního prostředí za ně zaplatí úroky i další náklady, které by jinak vstupovaly do RPSN.","Prakticky to znamená, že splácíte jen jistinu. Pokud si půjčíte 600 000 Kč, vrátíte 600 000 Kč. Úvěr do 500 000 Kč je bez úroků až 10 let, vyšší úvěr až 15 let. U zajištěného úvěru na komplexní renovaci a domácnosti do 4. příjmového decilu až 25 let.","Limity jsou dva. Na dílčí opatření, například jen okna nebo tepelné čerpadlo, nejvýše 750 000 Kč na dům. Na komplexní renovaci celé obálky domu nejvýše 2 000 000 Kč. Minimální vypočtená výše úvěru pro podání žádosti je 100 000 Kč.","Fond projekt schvaluje, ale úvěr poskytuje banka. Ta posuzuje bonitu domácnosti a může úvěr snížit nebo neposkytnout. Proto v kalkulaci vždy ukazujeme i vlastní zdroje a měsíční splátku.","Přímá dotace zůstala v programu NZÚ Light pro nízkopříjmové domácnosti: až 250 000 Kč na zateplení a až 150 000 Kč na zdroje energie."]},{"slug":"dilci-nebo-komplexni-renovace","tema":"Bezúročné financování","nazev":"Dílčí, nebo komplexní renovace?","cteni":"3 min","perex":"Rozdíl mezi 750 000 Kč a 2 000 000 Kč bezúročného úvěru často dělá jediné opatření navíc.","telo":["Dílčí opatření znamená, že řešíte jen část domu. Žádostí můžete podat víc, celkový součet úvěrů na dílčí opatření ale nesmí přesáhnout 750 000 Kč na dům. Další žádost lze podat až po dokončení a vyúčtování té předchozí.","Komplexní opatření je celkové zateplení obálky domu: fasáda, střecha nebo strop, okna a podlaha. Nejpozději při dokončení musí být v domě alespoň jeden obnovitelný zdroj, například tepelné čerpadlo, solární ohřev vody nebo fotovoltaika. Na jeden dům lze podat jen jednu žádost o komplexní opatření.","Komplexní renovace potřebuje projektovou dokumentaci a energetické hodnocení. Dům musí po renovaci snížit dodanou i neobnovitelnou primární energii alespoň o 30 %.","Pokud plánujete většinu obálky, spočítejte si obě varianty. Kalkulačka vám ukáže, kolik byste čerpali v každém režimu."]},{"slug":"poradi-praci-pri-rekonstrukci","tema":"Rekonstrukce","nazev":"Pořadí prací: nejdřív obálka, potom zdroj","cteni":"3 min","perex":"Tepelné čerpadlo navržené pro nezateplený dům bude po zateplení předimenzované. Pořadí prací rozhoduje o ceně.","telo":["Dům je jeden systém. Tepelná ztráta určuje, jak velký zdroj tepla potřebujete. Když nejdřív koupíte tepelné čerpadlo a za dva roky zateplíte, máte stroj, který je pro dům zbytečně velký a pracuje méně efektivně.","Rozumné pořadí je obvykle: okna a zateplení, potom zdroj tepla, potom fotovoltaika a nakonec doladění řízení. Elektroinstalaci a rozvaděč je dobré vyřešit dřív, než přijde tepelné čerpadlo a fotovoltaika.","Pořadí opatření v NZÚ popisuje Renovační pas. Pokud plánujete etapy, pas určí, co má smysl udělat nejdřív a co může počkat."]},{"slug":"okna-uw-090","tema":"Okna","nazev":"Co znamená Uw 0,90 u oken","cteni":"2 min","perex":"Součinitel prostupu tepla celého okna. Čím nižší číslo, tím méně tepla oknem uteče.","telo":["Hodnota Uw udává, kolik wattů tepla projde jedním metrem čtverečním okna při rozdílu teplot jednoho stupně. Zahrnuje rám i zasklení. Pro bezúročný úvěr NZÚ musí mít okna a balkonové dveře Uw nejvýše 0,90 W/m²K, střešní okna nejvýše 1,0 a vstupní dveře UD nejvýše 1,2.","Kvalitní okno s trojsklem dosahuje hodnot kolem 0,7. Stejně důležitá jako okno je ale montáž. Okno osazené mimo rovinu izolace nebo bez správných pásek vytvoří tepelný most, kde se může srážet vlhkost."]},{"slug":"tepelne-cerpadlo-do-starsiho-domu","tema":"Tepelná čerpadla","nazev":"Tepelné čerpadlo do staršího domu","cteni":"3 min","perex":"Funguje i s radiátory. Rozhoduje teplota, kterou dům v mrazu potřebuje.","telo":["Tepelné čerpadlo pracuje nejúsporněji při nízké teplotě topné vody. Podlahové topení stačí ohřát na zhruba 35 °C, starší radiátory často potřebují víc. Čím vyšší teplota, tím nižší účinnost.","Proto začínáme výpočtem tepelné ztráty a kontrolou radiátorů. Někdy stačí vyměnit dva nebo tři poddimenzované radiátory, jindy je lepší nejdřív zateplit strop a vyměnit okna.","Pro bezúročný úvěr NZÚ musí jít o hlavní zdroj tepla v domě dokončeném před 1. 1. 2023. Limit je 350 000 Kč pro systém vzduch-voda a 400 000 Kč pro země-voda."]},{"slug":"fotovoltaika-vlastni-spotreba","tema":"FVE","nazev":"Kolik elektřiny z fotovoltaiky spotřebujete doma","cteni":"3 min","perex":"Bez baterie a řízení spotřebuje běžný dům zhruba třetinu výroby. Zbytek prodá levně do sítě.","telo":["Fotovoltaika vyrábí hlavně kolem poledne, kdy je dům často prázdný. Bez baterie a řízení proto doma využijete jen část výroby a zbytek prodáte za výkupní cenu, která bývá výrazně nižší než cena nakupované elektřiny.","Baterie posune výrobu do večera, energetický management pošle přebytky do bojleru, tepelného čerpadla nebo auta. Teprve s tím se z fotovoltaiky stává úspora.","Pro bezúročný úvěr NZÚ musí mít systém alespoň 3 kWp a třífázové připojení. Baterii lze financovat jen spolu s novou fotovoltaikou."]},{"slug":"revize-elektroinstalace","tema":"Elektro","nazev":"Revize elektroinstalace v rodinném domě","cteni":"2 min","perex":"Výchozí revize patří ke každé nové instalaci. U starších domů ukáže, jestli rozvody unesou nové spotřebiče.","telo":["Revizní technik zkontroluje stav rozvodů, jištění a ochranu před úrazem a výsledek zapíše do revizní zprávy. Po každé nové instalaci nebo rekonstrukci rozvodů se dělá výchozí revize.","U domů s hliníkovými rozvody nebo starým rozvaděčem doporučujeme revizi před instalací tepelného čerpadla, fotovoltaiky nebo wallboxu. Tyto spotřebiče výrazně zvyšují zatížení instalace."]},{"slug":"kde-dum-ztraci-teplo","tema":"Provozní náklady domu","nazev":"Kde dům ztrácí teplo","cteni":"2 min","perex":"Nezateplený dům ztrácí nejvíc teplo stěnami a střechou. Okna jsou menší plocha, ale velký podíl na ztrátě.","telo":["U typického nezatepleného domu připadá na obvodové stěny zhruba třetina tepelné ztráty, na střechu nebo strop pod půdou další výrazný podíl, zbytek na okna, podlahu a větrání.","Nejlevnější úsporou bývá zateplení stropu pod nevytápěnou půdou. Největší úsporu přináší fasáda. Konkrétní čísla pro váš dům určí energetický specialista v Renovačním pasu."]}],"hero":{"pred":{"src":"img/dum-pred.webp","alt":"Starší rodinný dům před rekonstrukcí"},"po":{"src":"img/dum-po.webp","alt":"Zateplený rodinný dům s fotovoltaikou na střeše"}},"fotoZdroje":{"poznamka":"Ilustrační fotografie z Pexels (licence Pexels: bezplatné komerční použití bez nutnosti uvádět autora). Před spuštěním je nahradí fotografie skutečných realizací NA ROVINU.","licence":"https://www.pexels.com/license/","polozky":[{"soubor":"dum-po","url":"https://www.pexels.com/photo/39761843/"},{"soubor":"dum-pred","url":"https://www.pexels.com/photo/18301272/"},{"soubor":"okna","url":"https://www.pexels.com/photo/5691531/"},{"soubor":"okna-montaz","url":"https://www.pexels.com/photo/5691544/"},{"soubor":"stavby","url":"https://www.pexels.com/photo/5511085/"},{"soubor":"teplo","url":"https://www.pexels.com/photo/38067300/"},{"soubor":"teplo-cerpadlo","url":"https://www.pexels.com/photo/20046693/"},{"soubor":"energie","url":"https://www.pexels.com/photo/9875418/"},{"soubor":"energie-strecha","url":"https://www.pexels.com/photo/17762230/"},{"soubor":"elektro","url":"https://www.pexels.com/photo/34054464/"},{"soubor":"elektro-rozvadec","url":"https://www.pexels.com/photo/28950842/"},{"soubor":"realizace-fve-dum","url":"https://www.pexels.com/photo/36388422/"},{"soubor":"novostavba","url":"https://www.pexels.com/photo/39634958/"},{"soubor":"pred-fasada-1","url":"https://www.pexels.com/photo/36936746/"},{"soubor":"pred-fasada-2","url":"https://www.pexels.com/photo/29934187/"},{"soubor":"pred-fasada-3","url":"https://www.pexels.com/photo/32083358/"},{"soubor":"pred-vesnice","url":"https://www.pexels.com/photo/30405814/"}]}}</script>

    p1k: { label: 'Přízemí a obytné podkroví', div: 1.7, vyska: 4.4 },
    p2:  { label: 'Dvě podlaží', div: 2, vyska: 6.0 },
    p2k: { label: 'Dvě podlaží a podkroví', div: 2.7, vyska: 7.4 },

  var VYTAPENI = {

  function ruleFor(rules, program, opatreni) {

  function calc(inp, rules, P) {

    var est = odhadPloch(plocha, inp.podlazi);

    var has = function (k) { return !!o[k]; };
    var items = [], warn = [], tipy = [];

    /* ---------- položky a ceny ---------- */

      var cOkna = plo * C['okna-' + mat].cena + dv * C.dvere.cena;
      item('okna', 'okna', 'Okna a dveře', plo, 'm²', cOkna, 'okna', plo + dv * C.dvere.plochaKs, { popis: C['okna-' + mat].nazev + (dv ? ', vchodové dveře ' + dv + ' ks' : '') });
      if (ok.stineni) {
        var st = Math.round(plo * 0.6);

      }
    }
    if (has('fasada')) { var f = +o.fasada.plocha || est.fasada; item('fasada', 'fasada', 'Zateplení fasády', f, 'm²', f * C.fasada.cena, 'fasada', f, { popis: C.fasada.nazev }); }
    if (has('strecha')) { var s = +o.strecha.plocha || est.strecha; item('strecha', 'strecha', 'Zateplení střechy', s, 'm²', s * C.strecha.cena, 'strecha', s, { popis: C.strecha.nazev }); }
    if (has('strop')) { var sp = +o.strop.plocha || est.strop; item('strop', 'strop', 'Zateplení stropu pod půdou', sp, 'm²', sp * C.strop.cena, 'strop', sp, { popis: C.strop.nazev }); }
    if (has('podlaha')) {
      var pt = o.podlaha.typ || 'zemina', pp = +o.podlaha.plocha || est.podlaha;
      item('podlaha', 'podlaha', 'Zateplení podlahy', pp, 'm²', pp * C['podlaha-' + pt].cena, 'podlaha-' + pt, pp, { popis: C['podlaha-' + pt].nazev });
    }

    if (has('tc')) {
      tcTyp = o.tc.typ && o.tc.typ !== 'nevim' ? o.tc.typ : 'vzduch-voda';
      var tcLbl = { 'vzduch-voda': 'vzduch-voda', 'zeme-voda': 'země-voda', 'vzduch-vzduch': 'vzduch-vzduch' }[tcTyp];
      item('tc', 'tc', 'Tepelné čerpadlo ' + tcLbl, 1, 'ks', C['tc-' + tcTyp].cena, 'tc-' + tcTyp, 1, { popis: C['tc-' + tcTyp].nazev });
      if (o.tc.soustava === 'nove-podlahove') {
        item('podlahove', 'podlahove', 'Podlahové topení', plocha, 'm²', plocha * C.podlahove.cena, null, 0, { popis: C.podlahove.nazev, mimoText: 'Otopná soustava se v limitu NZÚ nepočítá. Způsobilost ověříme u konkrétního projektu.' });
      }
      if (inp.vytapeni === 'tc') w('Dům už tepelné čerpadlo má. NZÚ nepodporuje rozšíření ani úpravu stávajícího podporovaného zdroje. Výměnu dožilého čerpadla posoudíme individuálně.', 'w');

    if (has('destovka')) { item('destovka', 'destovka', 'Využití dešťové vody', 1, 'ks', C.destovka.cena, 'destovka', 1, { popis: C.destovka.nazev }); }
    if (has('elektro')) {

      else { cE += C['elektro-rozvadec'].cena; popisE.push('Nový rozvaděč a revize'); }

    /* ---------- komplexní, nebo dílčí ---------- */

    });

    if (fv && fv.fazy === 'nevim' && fveIt && !fveIt.mimo) w('U fotovoltaiky ověříme, zda máte třífázovou přípojku. Je podmínkou NZÚ.', 'i');

        w('Komplexní renovace vyžaduje projektovou dokumentaci, energetické hodnocení a snížení dodané i neobnovitelné primární energie alespoň o 30 %. Na dům lze podat jen jednu žádost o komplexní opatření.', 'i');

    }
    if (nzuAny) {
      var pk = komplexni ? 'priprava-komplexni' : 'priprava-dilci';
      item('priprava', 'priprava', komplexni ? 'Projektová příprava a administrace' : 'Renovační pas a administrace NZÚ', 1, 'ks', C[pk].cena, null, 0, { popis: C[pk].nazev, mimo: 'Náklad přípravy, v limitech NZÚ nepočítáme.' });
    }

    var investice = sum(items, function (i) { return i.cena; });
    var sumPodpora = sum(podporovane, function (i) { return i.podpora; });

      dotaceZdroje = Math.min(sum(zdr, function (i) { return i.podpora; }), limit(rules, 'LIGHT-ZDROJE-MAX'));

    var t0 = tuvSrc0 === 'bojler' ? teplo(E.tuvKwh, 'bojler', bp0) : teplo(E.tuvKwh, tuvSrc0);
    var pred = h0.cost + t0.cost + E.zakladniElektrina * bp0;

    var fac = E.efektDleStavu[stav] || 1, U = E.uspory, red = [];
    ['fasada', 'okna', 'podlaha', 'reku', 'stineni'].forEach(function (k) { if (items.some(function (i) { return i.key === k; })) red.push(U[k]); });
    var hS = items.some(function (i) { return i.key === 'strecha'; }), hP = items.some(function (i) { return i.key === 'strop'; });
    if (hS || hP) red.push(hS && hP ? Math.max(U.strecha, U.strop) + 0.02 : hS ? U.strecha : U.strop);

    var src1 = has('tc') ? 'tc' : src0;

    var bp1 = zakladCena(src1);
    var h1 = teplo(Q1, src1, scop1);
    var t1;
    if (has('tc') && o.tc.tuv !== false && tcTyp !== 'vzduch-vzduch') t1 = teplo(E.tuvKwh, 'tc', scop1 * 0.85);
    else if (items.some(function (i) { return i.key === 'tuv'; }) && o.tuv.typ === 'tc') { var et = E.tuvKwh / E.scop['tuv-tc']; t1 = { cost: et * bp1, elec: et }; }
    else if (items.some(function (i) { return i.key === 'tuv'; })) { var rest = E.tuvKwh * (1 - E.solarPokryti); t1 = tuvSrc0 === 'bojler' ? teplo(rest, 'bojler', bp1) : teplo(rest, tuvSrc0, scop1 || null); }

    var fveBenefit = 0, fveVyroba = 0, fveVlastni = 0;

  function mergeSvg() {

      var y = top + i * h;
      s += '<text x="0" y="' + (y + 5) + '">' + t + '</text><circle cx="150" cy="' + y + '" r="4" class="dot"/>';
      s += '<path d="M154 ' + y + ' C 260 ' + y + ', 300 ' + hubY + ', 380 ' + hubY + '" class="ln"/>';
    });
    s += '<line x1="380" y1="' + hubY + '" x2="430" y2="' + hubY + '" class="ln-r"/><rect x="424" y="' + (hubY - 9) + '" width="18" height="18" class="hub" transform="skewX(-20)" style="transform-origin:433px ' + hubY + 'px"/>';
    s += '<text x="458" y="' + (hubY - 4) + '" class="end">Jeden</text><text x="458" y="' + (hubY + 16) + '" class="end">projekt</text>';

  /* ---------- finanční dashboard ---------- */
  function dash(r, opt) {
    opt = opt || {};
    var M = '<small> / měs.</small>';
    function mo(x) { return n(x) + ' Kč' + M; }
    var dop = r.uver > 0 ? r.cistyDopad : r.uspora;
    var dopK = r.uver > 0 ? (dop >= 0 ? 'Čistý dopad: ušetříte' : 'Čistý dopad: zaplatíte navíc') : 'Čistý dopad: ušetříte';
    var cells = [
      ['Cena projektu', kc(r.investice), 'orientační odhad', ''],
      [r.light ? 'Možná přímá dotace' : 'Podporované financování', r.light ? kc(r.dotace) : kc(r.uver), r.light ? 'NZÚ Light' : (r.uver ? 'bezúročný úvěr NZÚ, ' + r.doba + ' let' : 'mimo podmínky NZÚ'), 'g'],
      ['Vlastní zdroje', kc(r.vlastni), r.light && r.uver ? 'po dotaci a úvěru ' + kc(r.uver) : 'hotovost nebo běžný úvěr', ''],
      ['Orientační splátka', r.splatka ? mo(r.splatka) : '0 Kč', r.uver ? 'jen jistina, úroky platí stát' : 'bez úvěru NZÚ', ''],
      ['Úspora energie', mo(r.uspora), 'z ' + kcm(r.nakladyPred) + ' na ' + kcm(r.nakladyPo), 'g'],
      [dopK, mo(Math.abs(dop)), r.uver ? 'úspora mínus splátka, po splacení ušetříte ' + kcm(r.uspora) : 'úspora energie', 'total']
    ];
    return '<div class="dash"><div class="dash-head"><div><b>' + esc(opt.title || 'Ekonomika celé akce') + '</b>' + (opt.sub ? '<div class="muted" style="font-size:14px">' + esc(opt.sub) + '</div>' : '') + '</div><span class="tag">Orientační</span></div>' +
      '<div class="dash-grid' + (opt.compact ? '' : ' c3') + '">' + cells.map(function (c) { return '<div class="dash-cell ' + c[3] + '"><span class="k">' + c[0] + '</span><span class="v">' + c[1] + '</span><span class="s">' + c[2] + '</span></div>'; }).join('') + '</div>' +
      '<div class="dash-foot">Předběžná kalkulace podle Závazných pokynů NZÚ platných od 24. 6. 2026 a orientačního ceníku. Výsledek podléhá ověření.</div></div>';
  }

  function pageHead(eb, title, lead, actions, crumbs) {

  function nzuRulesFor(codes) {
    var rows = [];
    codes.forEach(function (c) {
      var rr = RULES.pravidla.filter(function (x) { return x.kod === c; })[0]; if (!rr) return;
      var l = RULES.pravidla.filter(function (x) { return x.program === 'NZU-LIGHT' && x.opatreni === rr.opatreni; })[0];
      rows.push('<tr><td class="nm">' + esc(rr.nazev) + '<span class="sub">' + esc(rr.omezeni.slice(0, 2).join(' · ')) + '</span></td><td class="n" data-label="Bezúročný úvěr">' + sazba(rr) + '</td><td class="n" data-label="NZÚ Light dotace">' + (l ? sazba(l) : '<span class="muted">nepodporuje</span>') + '</td></tr>');
    });
    if (!rows.length) return '';
    return '<div class="tbl-wrap"><table class="tbl narrow"><thead><tr><th>Opatření</th><th class="n">Bezúročný úvěr</th><th class="n">NZÚ Light dotace</th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  }
  function sazba(rr) {
    if (rr.typVypoctu === 'pausal') return 'až ' + kc(rr.maximum);
    var u = { m2: 'm²', kWp: 'kWp', kWh: 'kWh' }[rr.jednotka] || rr.jednotka;
    return kc(rr.jednotkovaPodpora) + ' / ' + u + (rr.maximum ? ', max. ' + kc(rr.maximum) : '');
  }

    var head = '<section class="phead" style="box-shadow:inset 0 4px 0 ' + d.akcent + '"><div class="gridbg" aria-hidden="true"><i class="b1"></i></div><div class="wrap hero-in" style="padding-block:clamp(40px,6vw,80px)">' +

      '<ul class="rows">' + d.oblasti.concat(d.dalsi).map(function (o) { return '<li><a class="row" href="#' + d.key + '-' + o.slug + '" data-go="' + d.key + '-' + o.slug + '" data-svc="' + o.slug + '"><div><span class="h3">' + o.nazev + '</span><p>' + o.lead + '</p></div><span class="go" aria-hidden="true">→</span></a></li>'; }).join('') + '</ul></div></section>';

    return head + areas + xs + nzuSec + projSec + finalCta();

  function utm() {
    var p = {}; try { var q = new URLSearchParams(location.search); ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'].forEach(function (k) { if (q.get(k)) p[k] = q.get(k); }); } catch (e) { }

  function submitLead() {
    var L = S.lead, err = function (t) { var e = $('#l-err'); e.hidden = false; e.textContent = t; };
    if (L.step === 0 && !L.sluzby.length) return err('Vyberte alespoň jednu oblast.');
    if (L.step === 1) { var ps = $('#l-psc').value.replace(/\s/g, ''); L.obec = $('#l-obec').value.trim(); if (!/^\d{5}$/.test(ps) && !L.obec) return err('Zadejte PSČ nebo obec.'); L.psc = ps; }
    if (L.step === 2 && !L.termin) return err('Vyberte termín.');
    if (L.step === 4) {
      L.jmeno = $('#l-jmeno').value.trim(); L.telefon = $('#l-tel').value.trim(); L.email = $('#l-email').value.trim(); L.pozn = $('#l-pozn').value.trim(); L.souhlas = $('#l-souhlas').checked;
      if (!L.jmeno) return err('Doplňte jméno.');
      if (!L.telefon && !L.email) return err('Doplňte telefon nebo e-mail, ať se vám můžeme ozvat.');
      if (L.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(L.email)) return err('E-mail nemá správný tvar.');
      if (!L.souhlas) return err('Bez souhlasu se zpracováním údajů poptávku nemůžeme přijmout.');
      var r = S.last, d = S.calc.data;
      L.payload = {
        jmeno: L.jmeno, telefon: L.telefon, email: L.email,
        lokalita: { psc: L.psc || d.psc, obec: L.obec || d.obec },
        sluzby: L.sluzby, typDomu: d.typ || null,
        pozadovaneReseni: d.vyber && d.vyber.length ? d.vyber : L.sluzby,
        vysledekKalkulace: L.fromCalc && r ? { rezim: r.rezim, investice: r.investice, uver: r.uver, dotace: r.dotace, vlastni: r.vlastni, splatka: r.splatka, uspora: r.uspora } : null,
        rozpocet: r ? r.investice : null, termin: L.termin, poznamka: L.pozn,
        utm: utm(), zdrojLeadu: L.fromCalc ? 'kalkulacka' : 'formular', referrer: document.referrer || null,
        dokumenty: L.files.map(function (f) { return { nazev: f.name, velikost: f.size, typ: f.type }; }),
        vytvoreno: new Date().toISOString()
      };
      L.sent = true;
      track('lead_submit', { zdroj: L.payload.zdrojLeadu, sluzby: L.sluzby.join('|') });
      render(); window.scrollTo(0, 0); return;
    }
    L.step++; render(); window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-act],[data-opt]');
    if (!t) return;
    if (t.dataset.go) {
      e.preventDefault();
      if (t.dataset.cta) track('cta_click', { cta: t.dataset.cta, cil: t.dataset.go });
      if (t.dataset.svc) track('service_select', { sluzba: t.dataset.svc });
      if (t.dataset.pre) preselect(t.dataset.pre.split(','));
      closeMenu();
      go(t.dataset.go);
      return;
    }
    var a = t.dataset.act;
    if (t.dataset.opt !== undefined && !a) { onOpt(t); return; }
    switch (a) {
      case 'menu': openMenu(); break;
      case 'menu-close': closeMenu(); break;
      case 'q-back': S.calc.i = Math.max(0, S.calc.i - 1); S.calc.helper = null; renderCalcOnly(); break;
      case 'fill': var el = $('#' + t.dataset.target); if (el) { el.value = t.dataset.val; el.dispatchEvent(new Event('input')); } break;
      case 'helper': S.calc.helper = S.calc.helper === t.dataset.kind ? null : t.dataset.kind; keepFieldValues(); render(); var h = $('#helper'); if (h) h.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); break;
      case 'roof': S.calc.helperRoof = t.dataset.val; keepFieldValues(); render(); break;
      case 'helper-use':
        var val = helperCompute(t.dataset.kind);
        var target = { plocha: 'f-plocha', fasada: 'f-fasada', strecha: 'f-strecha', strop: 'f-strop', podlaha: 'f-podlaha', okna: 'f-okna' }[t.dataset.kind];
        var inp = $('#' + target); if (inp) inp.value = val; S.calc.helper = null; var hh = $('#helper'); if (hh) hh.remove(); toast('Hodnota doplněna: ' + n(val) + ' m²'); break;
      case 'calc-edit': S.calc.done = false; S.calc.i = 0; render(); window.scrollTo(0, 0); break;
      case 'overit': S.lead.fromCalc = true; S.lead.sent = false; S.lead.step = 0; S.lead.sluzby = mapToLead(S.calc.data.vyber); track('cta_click', { cta: 'nechat-overit' }); go('kontakt'); break;
      case 'add-measure': addMeasure(t.dataset.m); break;
      case 'cfg-t': var k = t.dataset.k; S.cfg.on[k] = !S.cfg.on[k]; S.cfg.hl = S.cfg.on[k] ? k : null; track('service_select', { konfigurator: k, zapnuto: S.cfg.on[k] }); cfgRefresh(); break;
      case 'cfg-calc': cfgToCalc(); break;
      case 'filtr': S.filtr = t.dataset.val; render(); break;
      case 'tema': S.tema = t.dataset.val; render(); break;
      case 'podobne': var p = OB.realizace.filter(function (x) { return x.id === t.dataset.id; })[0]; S.lead = Object.assign(S.lead, { step: 0, sent: false, fromCalc: false, sluzby: p.typy.map(typToLead).filter(Boolean), pozn: 'Podobné řešení jako: ' + p.nazev + ' (' + p.lokalita + ')' }); track('cta_click', { cta: 'chci-podobne', projekt: p.id }); go('kontakt'); break;
      case 'l-back': S.lead.step = Math.max(0, S.lead.step - 1); render(); break;
      case 'lead-new': S.lead = { step: 0, sluzby: [], psc: '', obec: '', termin: null, files: [], jmeno: '', telefon: '', email: '', pozn: '', souhlas: false, sent: false, fromCalc: false, payload: null }; render(); break;
      case 'file-rm': S.lead.files.splice(+t.dataset.k, 1); render(); break;
      case 'phone': track('phone_click'); break;
      case 'email': track('email_click'); break;
      case 'copy':
        track(t.dataset.kind === 'phone' ? 'phone_click' : 'email_click', { zpusob: 'kopirovat' });
        var txt = t.dataset.val;
        try { navigator.clipboard.writeText(txt).then(function () { toast('Zkopírováno: ' + txt); }, function () { selectText(t); }); } catch (er) { selectText(t); }
        break;
      case 'proto-hide': $('#proto').hidden = true; break;
    }
  });

  function selectText(btn) { var b = btn.parentElement.querySelector('b'); if (!b) return; var r = document.createRange(); r.selectNodeContents(b); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast('Označeno, zkopírujte pomocí Ctrl+C'); }

  function keepFieldValues() {
    var q = currentQ(), d = S.calc.data;
    if (q.key === 'plocha') { var v = readNum('f-plocha'); if (v) d.plocha = v; }
    if (q.m) { var map = { okna: 'f-okna', fasada: 'f-fasada', strecha: 'f-strecha', strop: 'f-strop', podlaha: 'f-podlaha' }; if (map[q.m]) { var x = readNum(map[q.m]); if (x) { d.o[q.m] = d.o[q.m] || {}; d.o[q.m].plocha = x; } } }
  }

  function onOpt(t) {
    var name = t.dataset.opt, val = t.dataset.val, d = S.calc.data;
    if (name === 'vyber') {
      var i = d.vyber.indexOf(val);
      if (i >= 0) d.vyber.splice(i, 1); else { d.vyber.push(val); if (val === 'komplet') applyKomplet(d); }
      track('service_select', { opatreni: val, vybrano: i < 0 });
      saveDraft(); keepScrollRender(); return;
    }
    if (['typ', 'podlazi', 'vytapeni', 'stav', 'domacnost'].indexOf(name) >= 0) {
      d[name] = val; saveDraft();
      if (!S.calc.started) { S.calc.started = true; track('calc_start'); }
      if (name === 'domacnost') { keepScrollRender(); return; }
      submitQ(); return;
    }
    if (name.indexOf('.') > 0) {
      var parts = name.split('.'), m = parts[0], f = parts[1];
      keepFieldValues();
      var o = d.o[m] = d.o[m] || {};
      readDetailNums(m, o);
      var isToggle = t.closest('[data-toggle-d]');
      if (isToggle) o[f] = f === 'tuv' ? (o.tuv === false ? true : false) : !o[f];
      else o[f] = f === 'existujici' ? val === '1' : val;
      saveDraft(); keepScrollRender(); return;
    }
    if (name === 'lead-sluzby') { var L = S.lead, j = L.sluzby.indexOf(val); if (j >= 0) L.sluzby.splice(j, 1); else L.sluzby.push(val); keepScrollRender(); return; }
    if (name === 'lead-termin') { S.lead.termin = val; submitLead(); return; }
  }
  function readDetailNums(m, o) {
    var map = { okna: 'f-okna', fasada: 'f-fasada', strecha: 'f-strecha', strop: 'f-strop', podlaha: 'f-podlaha', zelena: 'f-zelena' };
    if (map[m]) { var v = readNum(map[m]); if (v) o.plocha = v; }
    if (m === 'okna') { var dv = readNum('f-dvere'); if (dv != null) o.dvere = dv; }
    if (m === 'fve') { var kw = readNum('f-kwp'); if (kw) o.kwp = kw; var kh = readNum('f-kwh'); if (kh != null) o.kwh = kh; }
  }
  function keepScrollRender() { var y = window.scrollY; render(); window.scrollTo(0, y); }

  function preselect(list) {
    var d = S.calc.data;
    list.forEach(function (m) { if (!m) return; if (m === 'komplet') { if (d.vyber.indexOf('komplet') < 0) d.vyber.push('komplet'); applyKomplet(d); } else if (d.vyber.indexOf(m) < 0) d.vyber.push(m); });
    S.calc.done = false;
    S.calc.i = 0;
    saveDraft();
  }
  function addMeasure(m) {
    var d = S.calc.data;
    if (m === 'baterie') { d.o.fve = Object.assign({}, d.o.fve || {}, { baterie: true, kwh: (d.o.fve && d.o.fve.kwp) || 8 }); }
    else if (m === 'komplet') { if (d.vyber.indexOf('komplet') < 0) d.vyber.push('komplet'); applyKomplet(d); }
    else if (d.vyber.indexOf(m) < 0) d.vyber.push(m);
    track('service_select', { opatreni: m, zdroj: 'doporuceni' });
    finishCalc();
    toast('Přidáno do výpočtu');
  }
  function cfgToCalc() {
    var d = S.calc.data, c = S.cfg;
    d.typ = d.typ || 'rd'; d.rok = c.rok; d.plocha = c.plocha; d.podlazi = d.podlazi || 'p2'; d.vytapeni = c.vytapeni; d.stav = d.stav || 'puvodni';
    d.vyber = Object.keys(c.on).filter(function (k) { return c.on[k]; });
    if (c.on.fve) d.o.fve = Object.assign({ kwp: 8, baterie: true, kwh: 8, fazy: '3' }, d.o.fve || {});
    S.calc.done = false; S.calc.i = 4; saveDraft();
    track('cta_click', { cta: 'konfigurator-spocitat' });
    go('nzu-kalkulacka');
  }
  function mapToLead(v) {
    var m = { okna: 'Okna a dveře', fasada: 'Zateplení', strecha: 'Střecha', strop: 'Zateplení', podlaha: 'Zateplení', tc: 'Tepelné čerpadlo', fve: 'Fotovoltaika', baterie: 'Fotovoltaika', elektro: 'Elektro', komplet: 'Rekonstrukce domu', reku: 'Rekonstrukce domu' }, out = [];
    (v || []).forEach(function (k) { if (m[k] && out.indexOf(m[k]) < 0) out.push(m[k]); });
    return out;
  }
  function typToLead(t) { return { rekonstrukce: 'Rekonstrukce domu', okna: 'Okna a dveře', fve: 'Fotovoltaika', tc: 'Tepelné čerpadlo', zatepleni: 'Zateplení', elektro: 'Elektro', novostavby: 'Novostavba' }[t]; }

  function openMenu() { $('#mmenu').hidden = false; document.body.style.overflow = 'hidden'; var b = $('.burger'); if (b) b.setAttribute('aria-expanded', 'true'); }
  function closeMenu() { var m = $('#mmenu'); if (m && !m.hidden) { m.hidden = true; document.body.style.overflow = ''; var b = $('.burger'); if (b) b.setAttribute('aria-expanded', 'false'); } }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && S.route === 'nzu-kalkulacka' && S.calc.started && !S.calc.done) track('calc_abandon', { otazka: currentQ().key, duvod: 'skryto' }); });

  /* ---------- start ---------- */
  document.body.insertAdjacentHTML('afterbegin', IL.defs);
  document.body.classList.add('has-mcta');
  chrome();
  S.route = parse();
  render();
})();

</script>
</body>
